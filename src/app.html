<title>한글 모아모아 수읽기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 좌 기보판(10×16) / 우 조각·상태·AI 추천. 사용자가 지정한 남색+청록 판 톤의 단일 다크 테마 */
:root {
  color-scheme: dark;
  --bg: #0b1322; --panel: #111c31; --panel2: #16233d; --line: #243659; --line2: #2f4570;
  --fg: #e3ebf8; --muted: #8b9dbb; --faint: #5c6f91;
  --board: #0e3f52; --cell: #155166; --cell-line: #1f6479; --filled: #9fb3cc;
  --accent: #6ad8f2; --accent-ink: #062431;
  --c-blue: #4b95f3; --c-red: #f06275; --c-green: #46d17f; --c-yellow: #f6c94f; --c-gray: #9fb3cc;
  --good: #46d17f; --warn: #f6c94f; --bad: #f06275;
  --f-display: "Do Hyeon", "IBM Plex Sans KR", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; padding: 16px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 14px; }
.top h1 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin: 0; letter-spacing: .5px; }
.top .crumb { color: var(--muted); font-size: 13px; }
.wrap { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 16px; align-items: start; max-width: 1280px; }
@media (max-width: 920px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
.panel h2 { font-size: 15px; margin: 0 0 10px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.panel h2 small { font-weight: 400; color: var(--muted); font-size: 12px; }
.stack { display: grid; gap: 14px; min-width: 0; }

/* 보드 */
.board { display: grid; grid-template-columns: 18px repeat(10, minmax(0, 1fr)); gap: 3px; padding: 6px 6px 6px 2px; background: var(--board); border-radius: 10px; touch-action: none; user-select: none; -webkit-user-select: none; max-width: 470px; }
.ax { font: 600 10.5px var(--f-mono); color: color-mix(in srgb, var(--fg) 45%, transparent); display: flex; align-items: center; justify-content: center; }
.cell { aspect-ratio: 1; background: var(--cell); border-radius: 5px; position: relative; box-shadow: inset 0 0 0 1px var(--cell-line); display: flex; align-items: center; justify-content: center; font: 700 13px var(--f-mono); }
.cell.f { box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
.cell.c1 { background: var(--c-blue); } .cell.c2 { background: var(--c-red); } .cell.c3 { background: var(--c-green); } .cell.c4 { background: var(--c-yellow); } .cell.c5 { background: var(--c-gray); }
.cell > .no { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 700 clamp(11px, 2.6vw, 15px) var(--f-mono); color: #0b1322; z-index: 1; }
.cell .ic { position: absolute; inset: 18%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: 700 10px var(--f-body); color: #fff; border: 2px solid rgba(255,255,255,.85); }
.cell .ic.t0 { background: #2f7fe0; } .cell .ic.t1 { background: #9b56e8; }
.cell.pv { box-shadow: inset 0 0 0 2px var(--accent); background: color-mix(in srgb, var(--accent) 35%, var(--cell)); }
.cell.pv.bad { box-shadow: inset 0 0 0 2px var(--bad); background: color-mix(in srgb, var(--bad) 35%, var(--cell)); }
.cell.rec { color: #0b1322; background: var(--rc); box-shadow: inset 0 0 0 2px #fff; }
.cell.recold { background: var(--rc); opacity: .6; }
.cell.rec.reuse { background: linear-gradient(135deg, var(--c-gray) 0 38%, var(--rc) 38% 100%); }
.cell > .no { white-space: nowrap; letter-spacing: -0.5px; }
.ax.clr { color: var(--warn); text-decoration: line-through; }
.cell.recold > .no { color: #0b1322; font-size: 11px; }
.cell.clr::after { content: ""; position: absolute; inset: -2px; border-radius: 6px; border: 2px dashed var(--warn); pointer-events: none; }
.boardtools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { background: transparent; border: 0; border-radius: 6px; padding: 5px 9px; color: var(--muted); font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 11px; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
.hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; min-height: 19px; }
.hint b { color: var(--fg); }

/* 상태 */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.stat { background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; display: grid; gap: 2px; }
.stat label { color: var(--muted); font-size: 11.5px; }
.stat input { width: 100%; background: transparent; border: 0; font: 600 16px var(--f-mono); padding: 0; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 11px; color: var(--accent); }

/* 손패 */
.hand { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 6px; justify-items: center; text-align: center; min-height: 128px; }
.slot[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.slot .t { font-size: 12px; color: var(--muted); }
.slot .t b { color: var(--fg); }
.slot.empty .t b { color: var(--faint); }
.mini { display: grid; gap: 2px; }
.mini i { width: 11px; height: 11px; border-radius: 3px; display: block; }
.slot .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
.slot .acts button { font-size: 11.5px; padding: 3px 7px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line2); }
.palette { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
@media (max-width: 480px) { .palette { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.pal { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 4px; display: grid; justify-items: center; gap: 5px; min-height: 92px; align-content: start; }
.pal:hover { border-color: var(--accent); }
.pal .n { font-size: 11px; color: var(--muted); }
.pal .n b { color: var(--fg); font-family: var(--f-display); font-weight: 400; font-size: 14px; margin-left: 3px; }
.pal .mini i { width: 8px; height: 8px; border-radius: 2px; }
.pal .pr { font: 10px var(--f-mono); color: var(--faint); }

/* AI */
.ai-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.prog { font: 12px var(--f-mono); color: var(--muted); }
.bar { height: 4px; background: var(--panel2); border-radius: 4px; overflow: hidden; margin: 8px 0 10px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.advice { border-radius: 9px; padding: 8px 11px; font-size: 13px; margin-bottom: 10px; border: 1px solid; }
.advice.warn { border-color: color-mix(in srgb, var(--warn) 55%, transparent); background: color-mix(in srgb, var(--warn) 10%, transparent); }
.advice.bad { border-color: color-mix(in srgb, var(--bad) 55%, transparent); background: color-mix(in srgb, var(--bad) 10%, transparent); }
.advice.info { border-color: var(--line2); background: var(--panel2); color: var(--muted); }
.recs { display: grid; gap: 8px; }
.rec { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; width: 100%; }
.rec[aria-pressed="true"] { border-color: var(--accent); }
.rec .rk { font-family: var(--f-display); font-size: 22px; color: var(--muted); text-align: center; }
.rec[aria-pressed="true"] .rk { color: var(--accent); }
.rec .seq { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-width: 0; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.st .num { width: 17px; height: 17px; border-radius: 50%; background: var(--fg); color: var(--bg); font: 700 10.5px var(--f-mono); display: inline-flex; align-items: center; justify-content: center; }
.st .mini i { width: 7px; height: 7px; border-radius: 2px; }
.st .pos { font-family: var(--f-mono); color: var(--muted); font-size: 11.5px; }
.st .cl { color: var(--warn); font-weight: 600; }
.rec .val { text-align: right; font-variant-numeric: tabular-nums; }
.rec .val b { font: 600 15px var(--f-mono); display: block; }
.rec .val span { font-size: 11px; color: var(--muted); display: block; white-space: nowrap; }
.surv { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 10.5px; font-weight: 600; }
.surv.g { background: color-mix(in srgb, var(--good) 22%, transparent); color: var(--good); }
.surv.w { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
.surv.b { background: color-mix(in srgb, var(--bad) 22%, transparent); color: var(--bad); }
.recbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.recbar .spacer { flex: 1; }
.empty-note { color: var(--muted); font-size: 13px; padding: 14px; text-align: center; border: 1px dashed var(--line2); border-radius: 10px; }
details.set { margin-top: 2px; }
details.set summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.setgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; }
.setgrid label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.setgrid input[type=number], .setgrid select { background: var(--bg); border: 1px solid var(--line2); border-radius: 7px; padding: 5px 8px; color: var(--fg); }
.foot { color: var(--faint); font-size: 12px; margin-top: 14px; max-width: 1280px; line-height: 1.6; }
.foot b { color: var(--muted); font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 9px; font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="top">

<div class="wrap">
  <section class="panel">

    <div class="board" id="board" aria-label="게임판 10열 16행"></div>
    <div class="boardtools">
      <div class="seg" role="group" aria-label="입력 방식">
        <button id="m-paint" aria-pressed="true">칸 칠하기</button>
        <button id="m-place" aria-pressed="false">조각 놓기</button>
        <button id="m-icon0" aria-pressed="false">점찍기 아이콘</button>
        <button id="m-icon1" aria-pressed="false">바꿔뽑기 아이콘</button>

        <div class="stat"><label for="i-next">다음 능력까지</label><input id="i-next" type="number" min="1" max="7" inputmode="numeric"><span class="sub">번 배치</span></div>
        <div class="stat"><label for="i-dot">점찍기 보유</label><input id="i-dot" type="number" min="0" max="7" inputmode="numeric"></div>

      <div class="bar"><i id="barFill"></i></div>

      <div class="recs" id="recs"></div>
      <div class="recbar" id="recbar" hidden>
        <button class="btn" id="stepPrev">◀ 이전 수</button>

        <button class="btn primary" id="applyRec">이 수순대로 두기</button>
      </div>
      <details class="set">

          <label for="s-time">수읽기 시간(초)<input id="s-time" type="number" min="2" max="120" value="10"></label>
          <label for="s-depth">롤아웃 깊이(손패 수, 1손=3조각)<input id="s-depth" type="number" min="1" max="40" value="8"></label>
          <label for="s-beam">1차 탐색 빔 폭<input id="s-beam" type="number" min="4" max="60" value="24"></label>
          <label for="s-ratio">5단계 1칸:10칸 등장 비율(가정)<input id="s-ratio" type="number" min="0.05" max="1" step="0.05" value="0.6"></label>
          <label for="s-grav">줄 제거 후 위 줄<select id="s-grav"><option value="0">그대로 (기본)</option><option value="1">아래로 내려옴</option></select></label>

<script>
(function () {
  'use strict';
  const C = window.MoaCore, W = C.W, H = C.H, FULL = C.FULL, P = C.PIECES;
  const COLOR_IDX = { blue: 1, red: 2, green: 3, yellow: 4 };
  const CVAR = ['', 'var(--c-blue)', 'var(--c-red)', 'var(--c-green)', 'var(--c-yellow)', 'var(--c-gray)'];
  const $ = id => document.getElementById(id);
  const fmt = n => Math.round(n).toLocaleString('ko-KR');
  const stageName = l => (C.stageOf(l) + 1) + '단계';

  // ---------- 상태 ----------
  const S = {
    rows: new Int32Array(H), colors: new Uint8Array(W * H), icons: [], score: 0, lines: 0, dot: 0, reroll: 0, toNext: 7,
    hand: [null, null, null], sel: 0, mode: 'paint', gravity: false,
  };
  const undoStack = [];
  function snap() {
    undoStack.push(JSON.stringify({ rows: Array.from(S.rows), colors: Array.from(S.colors), icons: S.icons, score: S.score, lines: S.lines, dot: S.dot, reroll: S.reroll, toNext: S.toNext, hand: S.hand, sel: S.sel }));
    if (undoStack.length > 200) undoStack.shift();
  }
  function undo() {
    const s = undoStack.pop(); if (!s) return toast('되돌릴 기록이 없습니다');
    const o = JSON.parse(s);
    S.rows = Int32Array.from(o.rows); S.colors = Uint8Array.from(o.colors);
    Object.assign(S, { icons: o.icons, score: o.score, lines: o.lines, dot: o.dot, reroll: o.reroll, toNext: o.toNext, hand: o.hand, sel: o.sel });
    changed();
  }
  // 샘플 상태: 처음 열었을 때 실제 같은 진행 판
  function loadSample() {
    const pat = [
      '..........', '..........', '..........', '..........', '..........', '..........', '..........', '..........',
      '##........', '###.......', '####...#..', '#####.###.', '######.###', '###.######', '#########.', '####.#####'];
    S.rows.fill(0); S.colors.fill(0);
    pat.forEach((r, y) => { for (let x = 0; x < W; x++) if (r[x] === '#') { S.rows[y] |= 1 << x; S.colors[y * W + x] = 5; } });
    S.icons = [{ x: 9, y: 14, t: 1 }]; S.score = 4812; S.lines = 12; S.dot = 1; S.reroll = 0; S.toNext = 3;
    S.hand = [{ p: 1, rot: 0, flip: 0 }, { p: 11, rot: 0, flip: 0 }, { p: 5, rot: 0, flip: 0 }]; S.sel = 0;
  }

  // ---------- 렌더 ----------
  const board = $('board'), cells = [];
  const rowAx = [];
  const ax = t => { const s = document.createElement('span'); s.className = 'ax'; s.textContent = t; board.appendChild(s); return s; };
  ax(''); for (let i = 0; i < 10; i++) ax(i + 1);
  for (let y = 0; y < H; y++) {
    rowAx.push(ax(y + 1));
    for (let x = 0; x < W; x++) { const d = document.createElement('div'); d.className = 'cell'; d.dataset.x = x; d.dataset.y = y; board.appendChild(d); cells.push(d); }
  }
  function miniHTML(cellsArr, color, cls) {
    let w = 0, h = 0; for (const [x, y] of cellsArr) { w = Math.max(w, x + 1); h = Math.max(h, y + 1); }
    const set = new Set(cellsArr.map(([x, y]) => y * 16 + x));
    let s = `<div class="mini ${cls || ''}" style="grid-template-columns:repeat(${w},auto)">`;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) s += `<i style="background:${set.has(y * 16 + x) ? color : 'transparent'}"></i>`;
    return s + '</div>';
  }
  const colorOf = p => CVAR[COLOR_IDX[P[p].color]];
  function variantOf(h) { return P[h.p].orient[h.flip * 4 + h.rot]; }

  // 미리보기/추천 오버레이
  let hover = null; // {x,y}
  let recView = { idx: -1, step: -1 };
  function overlayInfo() {
    const ov = new Map();
    if (S.mode === 'place' && hover && S.hand[S.sel]) {
      const h = S.hand[S.sel], v = P[h.p].variants[variantOf(h)];
      const ox = Math.max(0, Math.min(W - v.w, hover.x - (v.w >> 1))), oy = Math.max(0, Math.min(H - v.h, hover.y - (v.h >> 1)));
      const ok = ox >= 0 && oy >= 0 && ox + v.w <= W && oy + v.h <= H && C.fits(S.rows, v, ox, oy);
      for (const [cx, cy] of v.cells) { const x = ox + cx, y = oy + cy; if (x >= 0 && y >= 0 && x < W && y < H) ov.set(y * W + x, { pv: true, bad: !ok }); }
    }
    return ov;
  }
  function render() {
    // 추천 보기 중이면 해당 단계 보드
    let rows = S.rows, colors = S.colors, icons = S.icons, recMarks = null, clearRowsSet = null;
    const rec = recView.idx >= 0 ? recs[recView.idx] : null;
    if (rec) {
      const sim = simSteps(rec, recView.step);

    if (!workers.length) return;
    const el = Date.now() - simStart, n = recStats.reduce((a, s) => a + s.n, 0);
    $('barFill').style.width = Math.min(100, 4 + 96 * el / simMs) + '%';
    $('prog').textContent = `시뮬레이션 ${fmt(n)}판 · 후보 ${recs.length}개 · ${(el / 1000).toFixed(1)}초 / ${(simMs / 1000) | 0}초 · 누적 ${fmt(totalSims + n)}판`;
    setTimeout(tick, 200);
  }
  function finish() {
    const n = recStats.reduce((a, s) => a + s.n, 0);
    totalSims += n; try { localStorage.setItem('moa-total', String(totalSims)); } catch (e) {}
    $('barFill').style.width = '100%';
    $('prog').textContent = `완료 · 이번 수읽기 ${fmt(n)}판 · 누적 ${fmt(totalSims)}판`;
  }
  function score(i) {
    const s = recStats[i];
    if (!s || s.n < 4) return recs[i].v - 1e7; // 롤아웃 전에는 휴리스틱 순
    return s.sum / s.n;
  }
  function renderAdvice() {
    const el = $('advice'); el.innerHTML = '';
    if (!planRes) return;
    const m = planRes, parts = [];
    if (!m.complete) {
      parts.push(`<div class="advice bad"><b>${m.need}개 중 ${m.depth}개만 놓을 수 있습니다.</b> ${S.reroll ? '바꿔뽑기' : ''}${S.reroll && S.dot ? ' 또는 ' : ''}${S.dot ? '점찍기로 줄을 지운 뒤' : ''} ${S.reroll || S.dot ? '다시 계산하세요.' : '남은 능력이 없어 이번 손패가 마지막일 수 있습니다.'}</div>`);
    }
    if (m.advice && S.reroll > 0) {
      const d = m.advice.ev - m.advice.base, p = S.hand[m.advice.slot];
      if (d > 120 || !m.complete) parts.push(`<div class="advice warn">바꿔뽑기 권장: <b>${m.advice.slot + 1}번 슬롯 (${P[p.p].name})</b> · 평가값 기대 +${fmt(d)}. 사용 후 새 조각을 지정하면 다시 계산합니다.</div>`);
      else parts.push(`<div class="advice info">바꿔뽑기는 아끼는 편이 낫습니다 (가장 나은 슬롯 기준 기대 ${d >= 0 ? '+' : ''}${fmt(d)}).</div>`);
    }
    el.innerHTML = parts.join('');
  }
  function stepHTML(s, i) {
    if (s.type === 'dot') return `<span class="st"><span class="num">${i + 1}</span>점찍기 <span class="pos">${s.x + 1}열 ${s.y + 1}행</span>${s.cleared ? `<span class="cl">${s.cleared}줄</span>` : ''}</span>`;
    const p = P[s.piece], v = p.variants[s.v];
    return `<span class="st"><span class="num">${i + 1}</span>${miniHTML(v.cells, colorOf(s.piece))}<b>${p.name}</b><span class="pos">${s.x + 1}열 ${s.y + 1}행</span>${s.cleared ? `<span class="cl">${s.cleared}줄</span>` : ''}</span>`;
  }
  function renderRecs() {
    const el = $('recs');
    if (!recs.length) { el.innerHTML = planRes ? `<div class="empty-note">놓을 수 있는 자리가 없습니다</div>` : ''; $('recbar').hidden = true; return; }
    const order = recs.map((_, i) => i).sort((a, b) => score(b) - score(a));
    el.innerHTML = '';
    order.forEach((i, rank) => {
      const r = recs[i], s = recStats[i] || { n: 0 };
      const b = document.createElement('button'); b.className = 'rec'; b.setAttribute('aria-pressed', recView.idx === i);
      let val;
      if (s.n >= 4) {
        const surv = s.alive / s.n, mean = s.sum / s.n, se = Math.sqrt(Math.max(0, s.sq / s.n - mean * mean) / s.n);
        const sc = surv > .9 ? 'g' : surv > .7 ? 'w' : 'b';
        val = `<b>${fmt(mean)}</b><span>±${fmt(se * 1.96)} · ${fmt(s.n)}판</span><span><span class="surv ${sc}">생존 ${(surv * 100).toFixed(0)}%</span></span>`;
      } else val = `<b>${fmt(r.gain)}</b><span>즉시 점수</span><span>계산 대기</span>`;
      b.innerHTML = `<span class="rk">${rank + 1}</span><span class="seq">${r.steps.map(stepHTML).join('')}<span class="st" style="color:var(--muted)">즉시 +${fmt(r.gain)}</span></span><span class="val">${val}</span>`;
      b.addEventListener('click', () => { recView = { idx: i, step: defStep(recs[i]) }; renderRecs(); render(); updateStepTxt(); });
      el.appendChild(b);
    });
    $('recbar').hidden = recView.idx < 0;
    updateStepTxt();
  }
  function defStep() { return -1; }
  function updateStepTxt() {
    if (recView.idx < 0) return;
    const n = recs[recView.idx].steps.length;
    $('stepTxt').textContent = recView.step < 0 ? `전체 ${n}수 · 점선 줄은 수순 중 지워짐 · 사선 칸은 지운 뒤 다시 채움` : `${recView.step + 1}수째 두기 직전 (${n}수 중)`;
  }
  function clearRecView(r = true) { if (recView.idx >= 0) { recView = { idx: -1, step: -1 }; $('recbar').hidden = true; if (r) render(); } }
  $('stepNext').addEventListener('click', () => { if (recView.idx < 0) return; const n = recs[recView.idx].steps.length; recView.step = recView.step >= n - 1 ? -1 : recView.step + 1; render(); updateStepTxt(); });
  $('stepPrev').addEventListener('click', () => { if (recView.idx < 0) return; const n = recs[recView.idx].steps.length; recView.step = recView.step < 0 ? n - 1 : recView.step - 1; render(); updateStepTxt(); });
  $('applyRec').addEventListener('click', () => {
    if (recView.idx < 0) return;
    const r = recs[recView.idx]; snap();
    let total = 0, spawned = false;
    for (const s of r.steps) {
      if (s.type === 'dot') { const st = coreState(); applyColors(st, S.colors, [[s.x, s.y]], 5); C.placeDot(st, s.x, s.y); syncFrom(st); total += s.gain; continue; }
      const st = coreState(); const tc = P[s.piece].variants[s.v].cells.map(([cx, cy]) => [s.x + cx, s.y + cy]);
      applyColors(st, S.colors, tc, COLOR_IDX[P[s.piece].color]);
      const g = C.placePiece(st, s.slot, s.v, s.x, s.y); syncFrom(st); S.hand[s.slot] = null; total += g.gain;
      S.toNext--; if (S.toNext <= 0) { S.toNext = 7; if (S.dot + S.reroll < 7) spawned = true; }
    }
    S.sel = Math.max(0, [0, 1, 2].findIndex(x => S.hand[x]));
    if (spawned) setMode('icon1');
    toast(`수순 반영 +${fmt(total)}점` + (spawned ? ' · 능력 아이콘이 생겼다면 위치를 찍어주세요' : ' · 다음 조각 3개를 지정하세요'));
    changed();
  });
  $('stopSim').addEventListener('click', () => { if (workers.length) { killWorkers(); finish(); } });
  $('moreSim').addEventListener('click', () => {
    if (!recs.length || workers.length) return;
    const st = coreState(), cfg = settings();
    const plain = { rows: Array.from(st.rows), icons: st.icons, lines: st.lines, score: st.score, dot: st.dot, reroll: st.reroll, counter: st.counter, gravity: st.gravity, hand: st.hand };
    // 기존 통계 유지: 새 워커 결과를 더함
    const prev = recStats.map(s => ({ ...s })); const id = runId;
    perWorker = { base: prev }; simStart = Date.now(); simMs = cfg.ms;
    const cands = recs.map(r => ({ steps: r.steps }));
    for (let k = 0; k < cfg.nw; k++) {
      const w = new Worker(workerURL); workers.push(w);
      w.onmessage = e => { const m = e.data; if (m.id !== runId) return; perWorker['w' + m.wid] = m.stats; aggregate(); if (m.done) { w.terminate(); workers = workers.filter(x => x !== w); if (!workers.length) finish2(prev); } };
      w.postMessage({ type: 'roll', id, wid: k, state: plain, cands, ms: cfg.ms, hands: cfg.hands, deathPen: 3000, ratio: cfg.ratio, nt: ntMsg(), seed: (Math.random() * 1e9) | 0 });
    }
    tick();
  });
  function finish2(prev) {
    const n = recStats.reduce((a, s) => a + s.n, 0) - prev.reduce((a, s) => a + s.n, 0);
    totalSims += n; try { localStorage.setItem('moa-total', String(totalSims)); } catch (e) {}
    $('barFill').style.width = '100%';
    $('prog').textContent = `완료 · 추가 ${fmt(n)}판 · 후보별 합계 ${fmt(recStats.reduce((a, s) => a + s.n, 0))}판 · 누적 ${fmt(totalSims)}판`;
  }

  // ---------- 공통 ----------
  let tmr = 0, debounce = 0;
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tmr); tmr = setTimeout(() => el.classList.remove('on'), 2600); }
  function changed() {
    clearRecView(false);
    renderHand(); renderPalette(); renderStats(); render();
    const n = S.hand.filter(Boolean).length;
    $('hint').innerHTML = n ? `현재 ${stageName(S.lines)} · 손패 ${n}개 · 추천 수를 누르면 판에 수순 번호가 표시됩니다` : '<b>새 조각 3개</b>를 지정하세요';
    clearTimeout(debounce); debounce = setTimeout(analyze, 300);
  }
  const T = window.MOA_TRAIN || {};
  $('foot').innerHTML = `<b>점수 규칙</b> 배치 칸수 + 동시 제거 n줄당 300×n² (1줄 300 · 2줄 1,200 · 3줄 2,700 · 4줄 4,800 · 5줄 7,500) + 능력 획득 50점, 한 판 최대 500,000점. ` +
    `<b>조각 확률</b>은 공식 수치가 공개되지 않아 1단계 균등, 단계가 오를수록 칸수가 적은 조각이 덜 나오도록 가정했습니다(계산 설정에서 비율 조정). ` +
    `<b>평가</b>는 판 모양 패턴표(행 쌍·3×4·4×3 창) 가치 함수를 TD 자가대국 ${fmt(T.td || 0)}판으로 학습했고, 기존 평가식 가중치는 자가대국 ${fmt(T.games || 0)}판으로 맞췄습니다. ${T.bench ? T.bench + ' ' : ''}추천 순위는 각 후보 수순 뒤 무작위 미래 조각으로 설정한 깊이만큼 실제로 두어 본 평균 점수입니다(도중 게임 오버 시 −3,000). 능력 아이콘이 생기는 위치는 무작위라 실제 게임 화면을 보고 직접 찍어 주세요.`;
  setMode('paint'); loadSample(); changed();
})();
</script>
